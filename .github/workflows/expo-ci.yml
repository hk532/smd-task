name: Expo CI

on:
  push:
    branches: [main, feature/products]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Install and diagnose Expo project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Expo diagnostics
        run: npx expo-doctor@latest

      - name: Export Android bundle
        run: npx expo export --platform android

      - name: Controlled failure exercise
        run: exit 1